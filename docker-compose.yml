services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tiveri_demo
      POSTGRES_USER: tiveri_demo
      POSTGRES_PASSWORD: demo_only_change_me
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiveri_demo -d tiveri_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://tiveri_demo:demo_only_change_me@db:5432/tiveri_demo
      DEMO_MODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  pgdata:
