<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103c54">
  <title>Tiveri Billing | HIS teaching prototype</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>+</span></div>
        <div><strong>Tiveri</strong><small>HIS billing prototype</small></div>
      </div>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="nav">
        <button type="button" class="nav-item active" data-view="overview"><span class="nav-symbol">▦</span><span>Overview</span></button>
        <button type="button" class="nav-item" data-view="encounters"><span class="nav-symbol">▤</span><span>Encounters</span></button>
        <button type="button" class="nav-item" data-view="payer"><span class="nav-symbol">◇</span><span>Payer desk</span></button>
        <button type="button" class="nav-item" data-view="tariff"><span class="nav-symbol">≡</span><span>Tariff master</span></button>
        <button type="button" class="nav-item" data-view="audit"><span class="nav-symbol">◷</span><span>Activity log</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="live-dot"></span><div><strong>Local teaching build</strong><small>No live HIS or payer connection</small></div></div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <div class="breadcrumb">DH 308 <span>/</span> Hospital information system <span>/</span> Billing</div>
        <div class="top-actions"><span class="demo-label"><span class="live-dot"></span> Synthetic data</span><button type="button" class="top-link" data-action="reset">Reset demo</button></div>
      </header>
      <main id="app" class="main" aria-live="polite"></main>
    </div>
  </div>
  <dialog id="action-dialog" class="dialog">
    <form id="modal-form" method="dialog">
      <div class="modal-head"><div><div id="modal-eyebrow" class="eyebrow"></div><h2 id="modal-title"></h2></div><button type="button" id="modal-close" class="icon-button" aria-label="Close">×</button></div>
      <p id="modal-description" class="modal-description"></p>
      <div id="modal-fields" class="modal-fields"></div>
      <div class="modal-actions"><button type="button" id="modal-cancel" class="button button-quiet">Cancel</button><button type="submit" id="modal-submit" class="button button-primary">Save</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
